<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteBox</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playwrite+GB+J+Guides:ital@0;1&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header section -->
    <header>
      <nav>
        <div>
          <img
            src="images/logo.png"
            alt="Logo"
            width="100px"
            title="BiteBox logo"
          />
          <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="biteDeals.html">Bite Deals</a></li>
            <li>
              <a href="cart.html"
                >Cart <i class="fa-solid fa-cart-shopping"></i
              ></a>
            </li>
            <li>
              <a href="login.html"
                >Login <i class="fa-solid fa-right-to-bracket"></i
              ></a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <section class="auth">
        <div class="autbox">
            <h2>Login TO Bite<span>Box</span></h2>
            <form action="">
                <input type="text" placeholder="Enter Name " id="name" required><br>
                <input type="email" placeholder="enter your mail " id="mail" required><br>
                <div class="password-field">
                  <input type="password" placeholder="Enter password" id="password" required>
                  <button
                    type="button"
                    class="password-toggle"
                    aria-label="Show password"
                    onclick="togglePassword()"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
            <button type="button" onclick="login()">Submit</button><br>
            </form>
            <p id="error">Error message</p> 
            <p>   
                <p>Don,t Have an Account signiup</p>
                <a href="signup.html"><button>signup</button></a><br>
            </p>
        </div>
    </section>
<script src="js/script.js">

</script>
  </body>
</html>
